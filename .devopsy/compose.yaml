# A private Docker registry (CNCF distribution) behind devopsy-template-traefik, with
# htpasswd authentication. Images live in ./mnt/registry (on servers
# shared/mnt/registry).
#
# REGISTRY_PASSWORD and REGISTRY_HTTP_SECRET are secrets in .devopsy/.env (on
# servers shared/.env). `devopsy deploy` generates them on its first run, and
# writes ./mnt/auth/htpasswd from REGISTRY_USER and REGISTRY_PASSWORD.
services:
  registry:
    image: registry:3.1.2
    restart: unless-stopped
    # Not root, not the deploy user (1000): see "Conventions" in the devopsy
    # workspace README. init gives it the storage directory.
    user: "10001:10001"
    read_only: true
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: ${DEVOPSY_PROJECT_NAME:-registry}
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      # Signs upload state between requests; must not change during uploads.
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:?run devopsy deploy once to generate it}
      # Lets `docker manifest`/API deletes remove tags, so gc can free space.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      # No OpenTelemetry collector here: do not try to send traces.
      OTEL_TRACES_EXPORTER: none
      REGISTRY_LOG_LEVEL: info
    volumes:
      - ./mnt/registry:/var/lib/registry
      - ./mnt/auth:/auth:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # / answers 200 without credentials; /v2/ needs them.
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:5000/]
      interval: 10s
      start_period: 10s
      start_interval: 1s
    labels:
      # Each release gets the server's wildcard domain from its proxy
      # (devopsy-template-traefik exports it), for <project>.<domain>. Without a
      # proxy running the release fails: the project expects one.
      - devopsy.import.DEVOPSY_WILDCARD_DOMAIN=proxy/WILDCARD_DOMAIN
      - traefik.enable=true
      # <project>.<DEVOPSY_WILDCARD_DOMAIN> plus the target's DEVOPSY_DOMAINS.
      # The fallback, for plain docker compose, is a HostRegexp: Traefik
      # requests no certificate for it, so a target without hosts logs no
      # ACME errors.
      - traefik.http.routers.${DEVOPSY_PROJECT_NAME:-app}.rule=${DEVOPSY_HOST_RULE:-HostRegexp(`^app\.localhost$`)}
      # letsencrypt1 (HTTP-01, the default), acmedns or cloudflare (DNS-01),
      # per target, in targets.yaml.
      - traefik.http.routers.${DEVOPSY_PROJECT_NAME:-app}.tls.certresolver=${CERTRESOLVER:-letsencrypt1}
      - traefik.http.services.${DEVOPSY_PROJECT_NAME:-app}.loadbalancer.server.port=5000
    networks: [default, traefik]

  # shared/mnt belongs to the deploy user and Docker creates a missing
  # bind-mount directory as root: hand the storage to the registry's UID.
  init:
    image: registry:3.1.2
    user: root
    entrypoint: [chown, "10001:10001", /var/lib/registry]
    volumes:
      - ./mnt/registry:/var/lib/registry
    network_mode: none

  # `devopsy deploy` hashes the password with it (bcrypt, which the registry
  # requires). Never started by `up`.
  htpasswd:
    image: httpd:2.4.69-alpine
    profiles: [tools]
    entrypoint: [htpasswd]
    network_mode: none

networks:
  traefik:
    name: traefik-main
    external: true
